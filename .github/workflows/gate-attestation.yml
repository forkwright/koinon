# WHY(kanon#2522): replaces koinon's trailer-only passthrough (previously
# `uses: forkwright/.github/.github/workflows/gate-attestation.yml@5be130bf...`
# -- pure trailer verify, no full-build fallback, no ai-attribution, no
# doc-only exemption) with the kanon-designed hybrid gate: a trailer-stamped
# PR fast-paths; a trailer-less PR falls through to a real fmt/check/clippy/
# nextest build on GH-hosted ubuntu-latest. All gate logic lives in
# forkwright/.github/.github/workflows/hybrid-gate.yml -- this file only
# supplies koinon's own commands, flags, and the two policy toggles.
#
# WHY hosted in forkwright/.github, not forkwright/kanon: GitHub cannot
# resolve a workflow_call reference into a private repo owned by a personal
# account for other-repo callers -- this adoption originally pointed at
# kanon and failed to even schedule the workflow (no run appeared at all)
# before being repointed at the public .github host, which already serves
# the org-default trailer-only reusable to 8 repos successfully.
#
# WHY ai_attribution_check/docs_only_exemption ARE set below: the extended
# hybrid-gate.yml (declaring both workflow_call inputs) is now live at
# forkwright/.github.
#
# NOTE(double-build-cost, mirrors the harmonia/epistole design question):
# koinon/.github/workflows/ci.yml already runs `cargo build --all-targets`,
# a 4-way `cargo check --no-default-features [+telemetry|config|cli]` feature
# matrix, `cargo test`, `cargo clippy --all-targets`, and `cargo fmt --check`
# unconditionally on every push+PR to main (job `test`), regardless of
# trailer. Once `full-gate-build` also compiles+tests on trailer-less PRs,
# those PRs pay for the build twice in one run. koinon's `test` job is NOT
# currently in required-status-checks (only ["gate / gate-attestation",
# "cargo deny"] are) -- so the double-spend is pure CI-minutes, not
# required-check duplication. Recommend trimming ci.yml's now-redundant
# build/test/clippy/fmt steps once full-gate-build is proven green, keeping
# ci.yml only for what hybrid-gate.yml doesn't cover (the feature-matrix
# cargo-check combinations, cargo-deny, commitlint).
#
# NOTE: koinon's ci.yml runs plain `cargo test` (not nextest), which
# implicitly executes doctests too. `cargo nextest run` does NOT run
# doctests, so `doctest_cmd` below is set explicitly to
# "cargo test --workspace --doc" to avoid silently dropping doctest coverage
# that koinon's own CI already exercises today.
name: Gate Attestation

on:
  pull_request:
    branches: [main]
  # WHY a push trigger and not just pull_request: a squash merge does not
  # carry the source commits' trailers, so no commit on main has a
  # Gate-Passed trailer -- check-trailer finds none and routes to
  # full-gate-build, which is the job that actually compiles the workspace.
  # Without this nothing ever builds main, and the first PR to inherit a
  # merged break is what discovers it (forkwright/theatron#235).
  push:
    branches: [main]

permissions:
  contents: read

# WHY no concurrency: block here: hybrid-gate.yml itself already declares
# `concurrency: group: ${{ github.workflow }}-${{ github.ref }}` and its own
# comment states callers must NOT also set a concurrency group with that
# same key, or the shared group self-cancels. koinon's PRIOR file set this
# exact key -- dropped here, not carried forward, for that reason.

jobs:
  gate:
    uses: forkwright/.github/.github/workflows/hybrid-gate.yml@main
    with:
      # WHY defaults kept as-is: koinon has its own rust-toolchain file
      # (channel 1.85, matches Cargo.toml rust-version) -- auto-detect
      # applies, no rust_toolchain override needed.
      fmt_cmd: "cargo fmt --all -- --check"
      check_cmd: "cargo check --workspace --all-targets"
      clippy_cmd: "cargo clippy --workspace --all-targets -- -D warnings"
      nextest_cmd: "cargo nextest run --workspace"
      doctest_cmd: "cargo test --workspace --doc"
      # WHY empty: koinon's ci.yml installs no apt packages, and its deps
      # (tracing, snafu, figment, clap, serde) are pure Rust -- no system
      # packages needed. Verified against ci.yml (no apt-get lines) and
      # Cargo.toml (no C-binding crates).
      system_packages: ""
      # WHY false: no `git = "https://github.com/forkwright/..."` entries in
      # koinon's Cargo.toml (single-package manifest, not a workspace) --
      # verified by direct grep, not assumed.
      needs_fleet_repo_token: false
      rust_cache_key: "gate-attestation"
      ai_attribution_check: true
      docs_only_exemption: true
    secrets: inherit

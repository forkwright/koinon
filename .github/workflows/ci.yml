name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      # WHY no `toolchain:` input: rust-toolchain.toml is the channel's one
      # place; a restated literal here drifts from it silently the next time
      # the file moves (kanon#3489).
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Build
        run: cargo build --all-targets
      - name: Feature matrix
        run: |
          cargo check --no-default-features
          cargo check --no-default-features --features telemetry
          cargo check --no-default-features --features config
          cargo check --no-default-features --features cli
          cargo check --no-default-features --features bootstrap
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --check

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check advisories licenses bans sources
          arguments: --all-features

  adoption:
    name: adoption
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Test
        working-directory: adoption
        run: uv run pytest
      - name: Lint
        working-directory: adoption
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Typecheck
        working-directory: adoption
        run: uv run mypy .
      # WHY offline-only here: `koinon-adoption check` re-parses the block
      # already committed in ADOPTION.md and never touches the network
      # (see adoption/README.md). The live cross-repo re-derivation runs on
      # its own schedule in adoption-refresh.yml, not on every push/PR —
      # coupling koinon's own CI to eleven other repos' current state would
      # make an unrelated koinon PR fail for reasons outside its diff.
      - name: Check adoption block freshness
        working-directory: adoption
        run: uv run python -m koinon_adoption check

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate conventional commits
        run: |
          TYPES="feat|fix|refactor|chore|docs|test|ci|perf|style|build|revert"
          failed=0
          while IFS= read -r msg; do
            echo "$msg" | grep -qE "^Merge " && continue
            if ! echo "$msg" | grep -qE "^($TYPES)(\(.+\))?: .+"; then
              echo "::error::Bad commit message: $msg"
              echo "  Expected: <type>(<scope>): <description>"
              echo "  Types: $TYPES"
              failed=1
            fi
          done < <(git log --format='%s' "origin/${{ github.base_ref }}..HEAD")
          exit $failed

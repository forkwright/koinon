[package]
name = "koinon"
description = "κοινόν — fleet-common Rust scaffolding: tracing init, typed errors, config loading, clap prelude"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/forkwright/koinon"
keywords = ["tracing", "config", "clap", "errors", "scaffolding"]
categories = ["development-tools"]
readme = "README.md"

[features]
default = ["telemetry", "config", "cli"]
telemetry = ["dep:tracing", "dep:tracing-subscriber"]
config = ["dep:figment", "dep:serde"]
cli = ["dep:clap", "telemetry"]

[dependencies]
# Tracing (feature: telemetry)
tracing = { version = "0.1", optional = true }

# Error handling (always on)
snafu = "0.8"

# Config loading (feature: config)
figment = { version = "0.10", features = ["toml", "env"], optional = true }

# CLI prelude (feature: cli)
clap = { version = "4", features = ["derive", "env"], optional = true }

# Tracing (feature: telemetry) - expanded form: inline table exceeds 80 columns
[dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter", "fmt", "json"]
optional = true

# Config loading (feature: config) - expanded form: inline table exceeds 80 columns
[dependencies.serde]
version = "1"
default-features = false
features = ["derive"]
optional = true

[dev-dependencies]
figment = { version = "0.10", features = ["toml", "env", "test"] }
tempfile = "3"

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"

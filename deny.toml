[graph]
targets = []
all-features = false

[advisories]
# WHY: single source of truth for advisory ignores (parity-derived to .cargo/audit.toml + osv-scanner.toml). Empty = no suppressions.
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true
skip = [
    # WHY: transitive dev-dependency chain (tempfile -> getrandom -> wasip2/wasip3)
    # pulls two wit-bindgen versions; not a direct koinon dependency choice.
    { crate = "wit-bindgen" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
